<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القاعة والموقع — علي و دانيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* palette drawn from the photo: ivory tulle, champagne light, amber-gold ring */
    --ink: #f3e7d3;
    --cream: #4a331e;
    --gold: #b9854a;
    --gold-soft: #96662e;
    --muted: #a58a68;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--cream);
    font-family: 'Almarai', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 3rem 1.4rem 4rem;
  }

  .page {
    width: 100%;
    max-width: 46rem;
    text-align: center;
    position: relative;
    padding: 3.5rem 2rem 3rem;
    border: 1px solid rgba(185,133,74,.4);
  }

  .back {
    position: absolute;
    top: 1.4rem;
    right: 1.6rem;
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    color: var(--muted);
    text-decoration: none;
    font-size: .85rem;
    font-weight: 300;
    transition: color .3s ease;
  }

  .back:hover { color: var(--gold-soft); }

  .back svg { transform: scaleX(-1); }

  .monogram {
    font-family: 'Amiri', serif;
    font-size: 1.9rem;
    color: var(--gold);
    margin-bottom: 1.4rem;
  }

  .eyebrow {
    font-size: .9rem;
    font-weight: 300;
    color: var(--muted);
    margin-bottom: 1.4rem;
  }

  h1 {
    font-family: 'Amiri', serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    line-height: 1.25;
  }

  .name-en {
    font-size: 1.05rem;
    direction: ltr;
    color: var(--gold-soft);
    margin-top: .6rem;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin: 2rem auto;
    color: var(--gold);
  }

  .divider::before,
  .divider::after {
    content: '';
    width: 64px;
    height: 1px;
    background: linear-gradient(to var(--dir, right), transparent, var(--gold));
  }
  .divider::after { --dir: left; }

  .divider .diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .details {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
    gap: 1.6rem;
    margin: 0 auto 2.4rem;
    max-width: 36rem;
  }

  .detail .label {
    font-size: .8rem;
    font-weight: 300;
    color: var(--muted);
    margin-bottom: .55rem;
  }

  .detail .value {
    font-family: 'Amiri', serif;
    font-size: 1.35rem;
    color: var(--cream);
  }

  .map-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    border: 1px solid rgba(185,133,74,.45);
    margin-bottom: 2.2rem;
    filter: grayscale(.2) sepia(.12);
  }

  .map-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .map-btn {
    display: inline-flex;
    align-items: center;
    gap: .7rem;
    padding: .95rem 2.8rem;
    border: 1px solid var(--gold);
    color: var(--gold-soft);
    text-decoration: none;
    font-size: .95rem;
    font-weight: 300;
    transition: background .4s ease, color .4s ease;
  }

  .map-btn svg { flex-shrink: 0; }

  .map-btn:hover {
    background: var(--gold);
    color: var(--ink);
  }

  .note {
    margin-top: 1.8rem;
    font-size: .95rem;
    font-weight: 300;
    line-height: 2;
    color: rgba(74,51,30,.75);
  }

  .reveal {
    opacity: 0;
    transform: translateY(20px);
    animation: rise 1s ease forwards;
  }
  .reveal:nth-child(2) { animation-delay: .15s; }
  .reveal:nth-child(3) { animation-delay: .3s; }
  .reveal:nth-child(4) { animation-delay: .45s; }
  .reveal:nth-child(5) { animation-delay: .6s; }
  .reveal:nth-child(6) { animation-delay: .75s; }
  .reveal:nth-child(7) { animation-delay: .9s; }
  .reveal:nth-child(8) { animation-delay: 1.05s; }
  .reveal:nth-child(9) { animation-delay: 1.2s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<main class="page">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M15 6l-6 6 6 6"/>
    </svg>
    العودة إلى الدعوة
  </a>

  <p class="monogram reveal">علي و دانيا</p>
  <p class="eyebrow reveal">القاعة والموقع</p>

  <h1 class="reveal">قاعة الاسطورة ٢</h1>
  <p class="name-en reveal">Al-Ostoura Hall 2</p>

  <div class="divider reveal"><span class="diamond"></span></div>

  <div class="details reveal">
    <div class="detail">
      <p class="label">التاريخ</p>
      <p class="value">السبت ٢٩ آب ٢٠٢٦</p>
    </div>
    <div class="detail">
      <p class="label">تنويه</p>
      <p class="value">للنساء فقط</p>
    </div>
  </div>

  <div class="map-frame reveal">
    <iframe
      src="https://www.google.com/maps?q=Al-Ostoura%20Hall%202%20%D9%82%D8%A7%D8%B9%D8%A9%20%D8%A7%D9%84%D8%A7%D8%B3%D8%B7%D9%88%D8%B1%D8%A9%20%D9%A2%20Baghdad&output=embed"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="خريطة قاعة الاسطورة ٢، بغداد">
    </iframe>
  </div>

  <a class="map-btn reveal" href="https://maps.app.goo.gl/74YDjmN4zY6SqjiZ9?g_st=awb" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11z"/>
      <circle cx="12" cy="10" r="2.6"/>
    </svg>
    افتح الموقع في خرائط كوكل
  </a>

  <p class="note reveal">بانتظار مشاركتكم فرحتنا</p>
</main>

</body>
</html>
