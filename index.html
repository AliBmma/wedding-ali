<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali &amp; Dania — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14100d;
    --cream: #f6f1ea;
    --gold: #c9a24b;
    --gold-soft: #e3c98a;
    --muted: #8f867b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
  }

  .invitation {
    display: grid;
    grid-template-columns: 45% 55%;
    min-height: 100vh;
  }

  /* ---------- Photo side ---------- */
  .photo-side {
    position: relative;
    overflow: hidden;
    min-height: 100vh;
  }

  .photo-side img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    animation: slowZoom 24s ease-in-out infinite alternate;
  }

  @keyframes slowZoom {
    from { transform: scale(1); }
    to   { transform: scale(1.08); }
  }

  .photo-side::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, transparent 55%, var(--ink) 100%),
                linear-gradient(to top, rgba(20,16,13,.55), transparent 40%);
    pointer-events: none;
  }

  .photo-caption {
    position: absolute;
    bottom: 2.2rem;
    left: 2.2rem;
    z-index: 2;
    font-size: .68rem;
    letter-spacing: .45em;
    text-transform: uppercase;
    color: rgba(246,241,234,.85);
  }

  /* ---------- Text side ---------- */
  .text-side {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 5rem 3rem;
    position: relative;
  }

  .text-side::before {
    content: '';
    position: absolute;
    inset: 1.4rem;
    border: 1px solid rgba(201,162,75,.28);
    pointer-events: none;
  }

  .eyebrow {
    font-size: .72rem;
    letter-spacing: .52em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 2.4rem;
  }

  .names {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(3.2rem, 6.5vw, 5.6rem);
    line-height: 1.05;
    letter-spacing: .04em;
  }

  .amp {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.2rem, 4.5vw, 3.6rem);
    color: var(--gold);
    display: block;
    margin: .6rem 0;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 2.6rem 0;
    color: var(--gold);
  }

  .divider::before,
  .divider::after {
    content: '';
    width: 72px;
    height: 1px;
    background: linear-gradient(to var(--dir, right), transparent, var(--gold));
  }
  .divider::after { --dir: left; }

  .divider .diamond {
    width: 7px;
    height: 7px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .date-block {
    display: flex;
    align-items: center;
    gap: 1.8rem;
    font-family: 'Cormorant Garamond', serif;
  }

  .date-block .day,
  .date-block .year {
    font-size: .78rem;
    font-family: 'Jost', sans-serif;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--muted);
    padding: .55rem 0;
    border-top: 1px solid rgba(201,162,75,.4);
    border-bottom: 1px solid rgba(201,162,75,.4);
  }

  .date-block .center {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .date-block .month {
    font-size: 1.05rem;
    letter-spacing: .5em;
    text-transform: uppercase;
    margin-bottom: .5rem;
    text-indent: .5em;
  }

  .date-block .num {
    font-size: 4.6rem;
    font-weight: 300;
    color: var(--gold-soft);
  }

  .invite-line {
    max-width: 30rem;
    margin-top: 2.6rem;
    font-weight: 300;
    font-size: .95rem;
    letter-spacing: .12em;
    line-height: 2;
    color: rgba(246,241,234,.82);
  }

  .countdown {
    display: flex;
    gap: clamp(1.2rem, 3vw, 2.6rem);
    margin-top: 2.8rem;
  }

  .countdown .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 3.6rem;
  }

  .countdown .value {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2rem, 4vw, 2.9rem);
    line-height: 1;
    color: var(--gold-soft);
    font-variant-numeric: tabular-nums;
  }

  .countdown .label {
    margin-top: .6rem;
    font-size: .62rem;
    letter-spacing: .38em;
    text-transform: uppercase;
    text-indent: .38em;
    color: var(--muted);
  }

  .countdown .unit + .unit {
    position: relative;
  }

  .countdown .unit + .unit::before {
    content: '';
    position: absolute;
    left: calc(-.5 * clamp(1.2rem, 3vw, 2.6rem));
    top: .35rem;
    bottom: 1.2rem;
    width: 1px;
    background: rgba(201,162,75,.3);
  }

  .map-btn {
    margin-top: 3rem;
    display: inline-flex;
    align-items: center;
    gap: .7rem;
    padding: .95rem 2.6rem;
    border: 1px solid var(--gold);
    color: var(--gold-soft);
    text-decoration: none;
    font-size: .72rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    text-indent: .32em;
    transition: background .4s ease, color .4s ease;
  }

  .map-btn svg { flex-shrink: 0; }

  .map-btn:hover {
    background: var(--gold);
    color: var(--ink);
  }

  .women-note {
    margin-top: 2.2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .7rem;
  }

  .women-note .note-en {
    display: inline-flex;
    align-items: center;
    gap: .9rem;
    font-size: .72rem;
    letter-spacing: .42em;
    text-transform: uppercase;
    text-indent: .42em;
    color: var(--gold-soft);
  }

  .women-note .note-ar {
    font-size: .95rem;
    color: var(--gold-soft);
  }

  .women-note .dot {
    width: 5px;
    height: 5px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  /* ---------- entrance animation ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    animation: rise 1.1s ease forwards;
  }
  .reveal:nth-child(2) { animation-delay: .25s; }
  .reveal:nth-child(3) { animation-delay: .45s; }
  .reveal:nth-child(4) { animation-delay: .65s; }
  .reveal:nth-child(5) { animation-delay: .85s; }
  .reveal:nth-child(6) { animation-delay: 1.05s; }
  .reveal:nth-child(7) { animation-delay: 1.25s; }
  .reveal:nth-child(8) { animation-delay: 1.45s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 880px) {
    .invitation { grid-template-columns: 1fr; }

    .photo-side {
      min-height: 58vh;
    }

    .photo-side::after {
      background: linear-gradient(to top, var(--ink) 2%, transparent 55%);
    }

    .text-side {
      padding: 3.5rem 1.6rem 4.5rem;
    }

    .text-side::before { inset: .9rem; }

    .date-block { gap: 1.1rem; }
    .date-block .num { font-size: 3.4rem; }
  }
</style>
</head>
<body>

<main class="invitation">

  <section class="photo-side">
    <img src="ring.jpg" alt="A woman's hand wearing a diamond engagement ring, gently held">
    <span class="photo-caption">She said yes</span>
  </section>

  <section class="text-side">
    <p class="eyebrow reveal">Together with their families</p>

    <h1 class="names reveal">
      Ali
      <span class="amp">&amp;</span>
      Dania
    </h1>

    <div class="divider reveal"><span class="diamond"></span></div>

    <div class="date-block reveal">
      <span class="day">Saturday</span>
      <span class="center">
        <span class="month">August</span>
        <span class="num">29</span>
      </span>
      <span class="year">2026</span>
    </div>

    <p class="invite-line reveal">
      joyfully invite you to celebrate their wedding —
      an evening of love, laughter, and happily ever after.
    </p>

    <div class="countdown reveal" aria-label="Countdown to the wedding">
      <span class="unit"><span class="value" id="cd-days">—</span><span class="label">Days</span></span>
      <span class="unit"><span class="value" id="cd-hours">—</span><span class="label">Hours</span></span>
      <span class="unit"><span class="value" id="cd-mins">—</span><span class="label">Minutes</span></span>
      <span class="unit"><span class="value" id="cd-secs">—</span><span class="label">Seconds</span></span>
    </div>

    <a class="map-btn reveal" href="location.html">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11z"/>
        <circle cx="12" cy="10" r="2.6"/>
      </svg>
      Venue &amp; Location
    </a>

    <div class="women-note reveal">
      <p class="note-en"><span class="dot"></span> For Women Only <span class="dot"></span></p>
      <p class="note-ar" lang="ar">للنساء فقط</p>
    </div>
  </section>

</main>

<script>
  (function () {
    var target = new Date(2026, 7, 29, 0, 0, 0); // August 29, 2026, local time
    var els = {
      days:  document.getElementById('cd-days'),
      hours: document.getElementById('cd-hours'),
      mins:  document.getElementById('cd-mins'),
      secs:  document.getElementById('cd-secs')
    };

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function tick() {
      var diff = target - new Date();
      if (diff <= 0) {
        els.days.textContent = '00';
        els.hours.textContent = '00';
        els.mins.textContent = '00';
        els.secs.textContent = '00';
        clearInterval(timer);
        return;
      }
      var s = Math.floor(diff / 1000);
      els.days.textContent  = pad(Math.floor(s / 86400));
      els.hours.textContent = pad(Math.floor(s / 3600) % 24);
      els.mins.textContent  = pad(Math.floor(s / 60) % 60);
      els.secs.textContent  = pad(s % 60);
    }

    var timer = setInterval(tick, 1000);
    tick();
  })();
</script>

</body>
</html>
