<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>علي و دانية — دعوة خطوبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Almarai:wght@300;400;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* palette drawn from the photo: ivory tulle, champagne light, amber-gold ring */
    --ink: #f3e7d3;
    --cream: #4a331e;
    --gold: #b9854a;
    --gold-soft: #96662e;
    --muted: #a58a68;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--cream);
    font-family: 'Almarai', sans-serif;
    min-height: 100vh;
  }

  .invitation {
    display: grid;
    grid-template-columns: 45% 55%;
    min-height: 100vh;
  }

  /* ---------- Photo side (appears on the right in RTL) ---------- */
  .photo-side {
    position: relative;
    overflow: hidden;
    min-height: 100vh;
  }

  .photo-side img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    animation: slowZoom 24s ease-in-out infinite alternate;
  }

  @keyframes slowZoom {
    from { transform: scale(1); }
    to   { transform: scale(1.08); }
  }

  .photo-side::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to left, transparent 55%, var(--ink) 100%),
                linear-gradient(to top, rgba(74,51,30,.4), transparent 40%);
    pointer-events: none;
  }

  .photo-caption {
    position: absolute;
    bottom: 2.2rem;
    right: 2.2rem;
    z-index: 2;
    direction: ltr;
    font-family: 'Jost', sans-serif;
    font-size: .68rem;
    letter-spacing: .45em;
    text-transform: uppercase;
    color: rgba(246,241,234,.95);
    text-shadow: 0 1px 10px rgba(74,51,30,.75);
  }

  /* ---------- Text side ---------- */
  .text-side {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 4.5rem 3rem;
    position: relative;
  }

  .text-side::before {
    content: '';
    position: absolute;
    inset: 1.4rem;
    border: 1px solid rgba(185,133,74,.4);
    pointer-events: none;
  }

  .quran {
    font-family: 'Amiri', serif;
    font-size: clamp(1.25rem, 2.6vw, 1.7rem);
    color: var(--gold-soft);
    margin-bottom: 1.8rem;
    line-height: 1.9;
  }

  .eyebrow {
    font-size: .85rem;
    font-weight: 300;
    color: var(--gold-soft);
    margin-bottom: 2rem;
  }

  .names {
    font-family: 'Amiri', serif;
    font-weight: 400;
    font-size: clamp(3rem, 6vw, 5rem);
    line-height: 1.15;
  }

  .amp {
    font-family: 'Amiri', serif;
    font-style: italic;
    font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    color: var(--gold);
    display: block;
    margin: .3rem 0;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 2.2rem 0;
    color: var(--gold);
  }

  .divider::before,
  .divider::after {
    content: '';
    width: 72px;
    height: 1px;
    background: linear-gradient(to var(--dir, right), transparent, var(--gold));
  }
  .divider::after { --dir: left; }

  .divider .diamond {
    width: 7px;
    height: 7px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .date-block {
    display: flex;
    align-items: center;
    gap: 1.8rem;
    font-family: 'Amiri', serif;
  }

  .date-block .day,
  .date-block .year {
    font-size: .95rem;
    font-family: 'Almarai', sans-serif;
    font-weight: 300;
    color: var(--muted);
    padding: .55rem 0;
    border-top: 1px solid rgba(185,133,74,.5);
    border-bottom: 1px solid rgba(185,133,74,.5);
  }

  .date-block .center {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .date-block .month {
    font-size: 1.3rem;
    margin-bottom: .5rem;
  }

  .date-block .num {
    font-size: 4.2rem;
    color: var(--gold-soft);
  }

  .invite-line {
    max-width: 30rem;
    margin-top: 2.4rem;
    font-weight: 300;
    font-size: 1rem;
    line-height: 2.1;
    color: rgba(74,51,30,.85);
  }

  .countdown {
    display: flex;
    gap: clamp(1.2rem, 3vw, 2.6rem);
    margin-top: 2.6rem;
  }

  .countdown .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 3.6rem;
  }

  .countdown .value {
    font-family: 'Amiri', serif;
    font-size: clamp(1.9rem, 4vw, 2.7rem);
    line-height: 1;
    color: var(--gold-soft);
  }

  .countdown .label {
    margin-top: .6rem;
    font-size: .78rem;
    font-weight: 300;
    color: var(--muted);
  }

  .countdown .unit + .unit {
    position: relative;
  }

  .countdown .unit + .unit::before {
    content: '';
    position: absolute;
    right: calc(-.5 * clamp(1.2rem, 3vw, 2.6rem));
    top: .35rem;
    bottom: 1.2rem;
    width: 1px;
    background: rgba(185,133,74,.35);
  }

  .map-btn {
    margin-top: 2.8rem;
    display: inline-flex;
    align-items: center;
    gap: .7rem;
    padding: .95rem 2.8rem;
    border: 1px solid var(--gold);
    color: var(--gold-soft);
    text-decoration: none;
    font-size: .95rem;
    font-weight: 300;
    transition: background .4s ease, color .4s ease;
  }

  .map-btn svg { flex-shrink: 0; }

  .map-btn:hover {
    background: var(--gold);
    color: var(--ink);
  }

  .women-note {
    margin-top: 2.2rem;
    display: inline-flex;
    align-items: center;
    gap: .9rem;
    font-size: 1rem;
    color: var(--gold-soft);
  }

  .women-note .dot {
    width: 5px;
    height: 5px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  /* ---------- entrance animation ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    animation: rise 1.1s ease forwards;
  }
  .reveal:nth-child(2) { animation-delay: .25s; }
  .reveal:nth-child(3) { animation-delay: .45s; }
  .reveal:nth-child(4) { animation-delay: .65s; }
  .reveal:nth-child(5) { animation-delay: .85s; }
  .reveal:nth-child(6) { animation-delay: 1.05s; }
  .reveal:nth-child(7) { animation-delay: 1.25s; }
  .reveal:nth-child(8) { animation-delay: 1.45s; }
  .reveal:nth-child(9) { animation-delay: 1.65s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 880px) {
    .invitation { grid-template-columns: 1fr; }

    .photo-side {
      min-height: 58vh;
    }

    .photo-side::after {
      background: linear-gradient(to top, var(--ink) 2%, transparent 55%);
    }

    .text-side {
      padding: 3rem 1.6rem 4rem;
    }

    .text-side::before { inset: .9rem; }

    .date-block { gap: 1.1rem; }
    .date-block .num { font-size: 3.2rem; }
  }
</style>
</head>
<body>

<main class="invitation">

  <section class="photo-side">
    <img src="ring3.jpg" alt="الخطيب يضع خاتم الخطوبة في يد خطيبته">
    <span class="photo-caption">She said yes</span>
  </section>

  <section class="text-side">
    <p class="quran reveal">﴿ وَجَعَلْنَا بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ﴾</p>

    <p class="eyebrow reveal">بدعوةٍ من عائلتيهما، يتشرفان بحضوركم حفل خطوبتهما</p>

    <h1 class="names reveal">
      علي
      <span class="amp">و</span>
      دانية
    </h1>

    <div class="divider reveal"><span class="diamond"></span></div>

    <div class="date-block reveal">
      <span class="day">السبت</span>
      <span class="center">
        <span class="month">آب</span>
        <span class="num">٢٩</span>
      </span>
      <span class="year">٢٠٢٦</span>
    </div>

    <p class="invite-line reveal">
      ندعوكم لمشاركتنا فرحتنا في أمسيةٍ يملؤها الحب والفرح،
      لنبدأ معاً حكاية العمر
    </p>

    <div class="countdown reveal" aria-label="العد التنازلي ليوم الخطوبة">
      <span class="unit"><span class="value" id="cd-days">—</span><span class="label">يوم</span></span>
      <span class="unit"><span class="value" id="cd-hours">—</span><span class="label">ساعة</span></span>
      <span class="unit"><span class="value" id="cd-mins">—</span><span class="label">دقيقة</span></span>
      <span class="unit"><span class="value" id="cd-secs">—</span><span class="label">ثانية</span></span>
    </div>

    <a class="map-btn reveal" href="location.html">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11z"/>
        <circle cx="12" cy="10" r="2.6"/>
      </svg>
      القاعة والموقع
    </a>

    <p class="women-note reveal"><span class="dot"></span> للنساء فقط <span class="dot"></span></p>
  </section>

</main>

<script>
  (function () {
    var target = new Date(2026, 7, 29, 0, 0, 0); // 29 آب 2026، بالتوقيت المحلي
    var els = {
      days:  document.getElementById('cd-days'),
      hours: document.getElementById('cd-hours'),
      mins:  document.getElementById('cd-mins'),
      secs:  document.getElementById('cd-secs')
    };

    var AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
    function ar(n) {
      var s = (n < 10 ? '0' + n : '' + n);
      return s.replace(/\d/g, function (d) { return AR_DIGITS[+d]; });
    }

    function tick() {
      var diff = target - new Date();
      if (diff <= 0) {
        els.days.textContent = ar(0);
        els.hours.textContent = ar(0);
        els.mins.textContent = ar(0);
        els.secs.textContent = ar(0);
        clearInterval(timer);
        return;
      }
      var s = Math.floor(diff / 1000);
      els.days.textContent  = ar(Math.floor(s / 86400));
      els.hours.textContent = ar(Math.floor(s / 3600) % 24);
      els.mins.textContent  = ar(Math.floor(s / 60) % 60);
      els.secs.textContent  = ar(s % 60);
    }

    var timer = setInterval(tick, 1000);
    tick();
  })();
</script>

</body>
</html>
